openapi: 3.1.0
info:
  title: envoyage serve — remote surface
  version: 0.2.0
  description: |
    The HTTP surface of `envoyage serve --http-port N`: MCP-over-Streamable-HTTP
    driving, a per-session live view (SSE) and input channel, and bounded public
    website crawling. Workers-safe — plain `fetch` + Server-Sent Events, no
    WebSocket on this surface.

    **Source of truth.** This spec documents the ACTUAL routes in
    `src/serve/http.rs`. Keep it in sync with the Bruno collection at
    `api-collections/envoyage/` on any serve-API change (see `docs/api/README.md`).

    **Auth.** Every route is bearer-gated when `ENVOYAGE_AUTH_TOKEN` is set; unset
    → no auth (local dev). There is no `/health` route.
servers:
  - url: http://localhost:{port}
    description: Local `envoyage serve --http-port {port}`
    variables:
      port:
        default: "8788"
        description: The value passed to `--http-port` (ENVOYAGE_HTTP_PORT).

security:
  - bearerAuth: []

paths:
  /mcp:
    post:
      operationId: mcpRequest
      summary: One JSON-RPC 2.0 MCP request (driving)
      description: |
        Dispatches a single JSON-RPC 2.0 MCP request through the same tool
        registry the stdio transport uses (`initialize`, `tools/list`,
        `tools/call`). Multi-session routing is via the optional
        `Mcp-Session-Id` header — each distinct id gets its own browser
        (its own CDP connection); no header → the single default `stdio` session.

        Response is plain JSON, or an SSE `event: message` frame when the client
        sends `Accept: text/event-stream` (MCP Streamable HTTP negotiation).
        A notification (no `id`) returns `202 Accepted` with no body.

        Tool results are bounded independently of every handler: serialized
        output cannot exceed 128 KiB, aggregate text is capped at 24 KiB, and
        inline image base64 is capped at 96 KiB. Drive actions return compact
        text while visual frames remain on the per-session SSE surface.
        `browser_screenshot` also captures nothing by default; its bounded image
        preview requires an explicit `inline: true` argument.

        The `browser_*` tool surface (from `tools/list`): `browser_open`,
        `browser_read_page`, `browser_find`, `browser_click`, `browser_form_input`,
        `browser_key`, `browser_scroll`, `browser_screenshot`, `browser_tabs_list`,
        `browser_tabs_switch`, `browser_close`, `browser_request_human`,
        `browser_wait_for_human`, `browser_wait_for`, `browser_console`,
        `browser_network`, `browser_upload`, `browser_gif`, and the env-gated
        `browser_eval` (`ENVOYAGE_BROWSER_EVAL=1`). Bounded crawling adds
        `crawl_start`, `crawl_read` and `crawl_cancel`; all three use the same
        domain service as the REST routes below.
      parameters:
        - $ref: '#/components/parameters/McpSessionId'
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum: ["application/json", "text/event-stream"]
          description: Send `text/event-stream` to get an SSE-framed reply.
        - name: X-Envoyage-Cdp-Url
          in: header
          required: false
          schema:
            type: string
          description: |
            Optional remote CDP WebSocket URL to drive instead of a local spawn
            (allow-listed CORS header on this surface).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: "initialize"
                  params: {}
              toolsList:
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: "tools/list"
                  params: {}
              openTab:
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: "tools/call"
                  params:
                    name: "browser_open"
                    arguments:
                      url: "https://example.com"
      responses:
        "200":
          description: |
            JSON-RPC response (plain JSON) or, with `Accept: text/event-stream`,
            a single `event: message` SSE frame carrying the JSON-RPC body.
            JSON-RPC-level errors (parse error, tool panic) also return 200 with
            an `error` member per the JSON-RPC spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
            text/event-stream:
              schema:
                type: string
                example: |
                  event: message
                  data: {"jsonrpc":"2.0","id":3,"result":{}}
        "202":
          description: Accepted — the request was a notification (no `id`); no body.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          description: Method not allowed (GET/DELETE on `/mcp`). POST JSON-RPC instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /sessions/{id}/events:
    get:
      operationId: sessionEvents
      summary: Per-session live-view SSE stream
      description: |
        A `text/event-stream` that replays the session's cached envelopes on
        connect (current frame first, then narration / state / handoff banner),
        then forwards every new envelope live. Each SSE event is NAMED by its
        protocol `type` so the client can dispatch on the event name. Frames ride
        as base64 PNG inside the `browser_frame` envelope. A 15s keep-alive
        comment holds the connection open; native `EventSource` auto-reconnects.

        Event names (each `data:` is the full JSON envelope):
        - `browser_frame` — Frame: `{png_base64, title, url, seq}`
        - `browser_cursor` — Cursor: `{x, y, action}` (action: move|click|type|scroll)
        - `browser_narration` — Narration: `{text}`
        - `browser_human_request` — HumanRequest: `{reason, instructions?}` (handoff banner)
        - `browser_state` — State: `{paused}`
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        "200":
          description: An open `text/event-stream` of named protocol events.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                frame:
                  value: |
                    event: browser_frame
                    data: {"type":"browser_frame","png_base64":"iVBORw0K...","title":"Example","url":"https://example.com","seq":42}
                cursor:
                  value: |
                    event: browser_cursor
                    data: {"type":"browser_cursor","x":120.0,"y":48.0,"action":"click"}
                narration:
                  value: |
                    event: browser_narration
                    data: {"type":"browser_narration","text":"Clicking \"Sign in\""}
                handoff:
                  value: |
                    event: browser_human_request
                    data: {"type":"browser_human_request","reason":"login","instructions":"solve the sign-in"}
                state:
                  value: |
                    event: browser_state
                    data: {"type":"browser_state","paused":true}
        "401":
          $ref: '#/components/responses/Unauthorized'

  /sessions/{id}/input:
    post:
      operationId: sessionInput
      summary: Push one human input event into a session (live-view handoff)
      description: |
        The human's live-view click / key / scroll, or a pause/continue control
        toggle, as one protocol `Input` object. Coordinates are page CSS pixels.
        Queued onto the session's input channel for its pump to dispatch.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
            examples:
              click: { value: { kind: click, x: 120, y: 48 } }
              key: { value: { kind: key, key: "Enter" } }
              scroll: { value: { kind: scroll, dy: -300 } }
              pause: { value: { kind: control, action: "pause" } }
      responses:
        "202":
          description: Accepted — event queued for the session's pump.
        "400":
          description: Invalid input event (did not match the `Input` wire shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /crawls:
    post:
      operationId: startCrawl
      summary: Start one bounded public-site crawl
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
          description: Exact replay key. A changed request with the same key fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
      responses:
        "202":
          description: Crawl accepted, or exact replay of the original crawl.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlJob' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          description: No crawl provider is configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /crawls/{crawlId}:
    get:
      operationId: readCrawl
      summary: Read one normalized crawl result page
      parameters:
        - $ref: '#/components/parameters/CrawlId'
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 16384 }
          description: Opaque cursor returned by the prior read. Pass unchanged.
      responses:
        "200":
          description: Normalized crawl state and one bounded result page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlJob' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelCrawl
      summary: Cancel one exact crawl
      parameters:
        - $ref: '#/components/parameters/CrawlId'
      responses:
        "200":
          description: Crawl cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlJob' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /crawls/{crawlId}/assets/{assetId}:
    get:
      operationId: downloadCrawlAsset
      summary: Download one raster image listed by this crawl
      description: |
        The asset must have appeared in a result page already read for this job.
        Envoyage re-checks the allowed host and public DNS address after every
        redirect, enforces the job byte budget and replays the first cached bytes.
      parameters:
        - $ref: '#/components/parameters/CrawlId'
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200":
          description: Exact cached raster bytes.
          headers:
            X-Envoyage-Content-Sha256:
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
            image/heic: { schema: { type: string, format: binary } }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <ENVOYAGE_AUTH_TOKEN>`. Required on every route
        when `ENVOYAGE_AUTH_TOKEN` is set; unset → auth disabled (local dev).

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Session id (matches the `Mcp-Session-Id` used for driving; `stdio` is the default).
    McpSessionId:
      name: Mcp-Session-Id
      in: header
      required: false
      schema:
        type: string
      description: Picks/creates the browser session. Omit → default `stdio` session.
    CrawlId:
      name: crawlId
      in: path
      required: true
      schema:
        type: string
        pattern: '^crawl-[a-f0-9]{32}$'
      description: Opaque Envoyage crawl id. Provider job ids are never exposed.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token (only when `ENVOYAGE_AUTH_TOKEN` is set).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: "missing or invalid bearer token"
    BadRequest:
      description: Invalid request, cursor, idempotency replay or bounded crawl input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Crawl or crawl asset not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    JsonRpcRequest:
      type: object
      required: [method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          description: Request id. Omit for a notification (→ 202, no response).
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        method:
          type: string
          enum: [initialize, tools/list, tools/call]
        params:
          type: object
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        result:
          type: object
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }
            data: {}
    Input:
      type: object
      required: [kind]
      description: One human input event. `kind` selects the variant.
      properties:
        kind:
          type: string
          enum: [click, key, scroll, control]
        x: { type: number, description: "click: page CSS x" }
        y: { type: number, description: "click: page CSS y" }
        key: { type: string, description: "key: a named key (Enter/Tab/…) or printable char" }
        dy: { type: number, description: "scroll: vertical wheel delta, +down" }
        action: { type: string, enum: [pause, continue], description: "control: automation toggle" }
    CrawlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        adapter:
          type: string
          enum: [auto, generic, shopify_collection, shopify_product]
          default: auto
        allowedHosts:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 253 }
        includePaths:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 256 }
        excludePaths:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 256 }
        discovery:
          type: string
          enum: [sitemap_and_links, sitemap_only, links_only]
          default: sitemap_and_links
        render:
          type: string
          enum: [auto, static, browser]
          default: auto
        capture:
          $ref: '#/components/schemas/CrawlCapture'
        limits:
          $ref: '#/components/schemas/CrawlLimits'
    CrawlCapture:
      type: object
      additionalProperties: false
      properties:
        sections: { type: boolean, default: true }
        links: { type: boolean, default: true }
        media: { type: boolean, default: true }
        markdown: { type: boolean, default: false }
        html: { type: boolean, default: false }
    CrawlLimits:
      type: object
      additionalProperties: false
      properties:
        maxPages: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        maxDepth: { type: integer, minimum: 0, maximum: 20, default: 6 }
        maxAssets: { type: integer, minimum: 1, maximum: 20000, default: 5000 }
        maxContentBytes: { type: integer, minimum: 1, maximum: 1073741824, default: 67108864 }
        maxDurationSecs: { type: integer, minimum: 1, maximum: 3600, default: 900 }
        maxConcurrency: { type: integer, minimum: 1, maximum: 20, default: 5 }
    CrawlJob:
      type: object
      required: [id, adapter, adapterVersion, state, requestFingerprint, createdAtMs, progress, pages, warnings]
      properties:
        id: { type: string, pattern: '^crawl-[a-f0-9]{32}$' }
        adapter: { type: string }
        adapterVersion: { type: string }
        state: { type: string, enum: [queued, running, completed, failed, cancelled] }
        requestFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAtMs: { type: integer, minimum: 0 }
        progress: { $ref: '#/components/schemas/CrawlProgress' }
        pages:
          type: array
          items: { $ref: '#/components/schemas/CrawlPage' }
        nextCursor: { type: string }
        warnings:
          type: array
          items: { type: string }
        error: { type: string }
    CrawlProgress:
      type: object
      required: [completedPages, totalPages, returnedPages, returnedAssets, returnedContentBytes]
      properties:
        completedPages: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        returnedPages: { type: integer, minimum: 0 }
        returnedAssets: { type: integer, minimum: 0 }
        returnedContentBytes: { type: integer, minimum: 0 }
    CrawlPage:
      type: object
      required: [url, breadcrumbs, sections, links, media, contentSha256, truncated]
      properties:
        url: { type: string, format: uri }
        canonicalUrl: { type: string, format: uri }
        pageType: { type: string }
        productKey: { type: string }
        breadcrumbs:
          type: array
          items: { type: string }
        title: { type: string }
        description: { type: string }
        statusCode: { type: integer, minimum: 100, maximum: 599 }
        sections:
          type: array
          items: { $ref: '#/components/schemas/CrawlSection' }
        links:
          type: array
          items: { type: string, format: uri }
        media:
          type: array
          items: { $ref: '#/components/schemas/CrawlMedia' }
        markdown: { type: string }
        html: { type: string }
        contentSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        truncated: { type: boolean }
    CrawlSection:
      type: object
      required: [level, heading, text]
      properties:
        level: { type: integer, minimum: 1, maximum: 6 }
        heading: { type: string }
        text: { type: string }
    CrawlMedia:
      type: object
      required: [id, position, url]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{64}$' }
        position: { type: integer, minimum: 0 }
        url: { type: string, format: uri }
        alt: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    ErrorBody:
      type: object
      properties:
        error:
          type: string

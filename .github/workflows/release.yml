name: Release

# Builds the `envoyage` binary for macOS arm64 + Linux x86_64/aarch64, then
# publishes the npm packages (@envoyage/cli + 3 platform packages) via
# npm Trusted Publishing (OIDC). Mirrors immorterm-memory's publish lane:
# platform binaries ship AS npm packages (optionalDependencies), so an
# unauthenticated `npm install` never hits GitHub Releases — works for a
# PRIVATE repo.
#
# A GitHub Release with the tarballs is also created (handy for manual pulls).
#
# BEFORE FIRST PUBLISH: configure Trusted Publishing on npmjs.com for
# @envoyage/cli and each @envoyage/cli-<platform> package, pointing at
# this repo + this workflow file. No NPM_TOKEN secret is used.
#
# Trigger manually. Artifact names: envoyage-<os>-<arch>.tar.gz.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.1). Blank = version from Cargo.toml."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: envoyage-linux-x86_64
            cross_packages: ""
            cross_linker: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: envoyage-linux-aarch64
            cross_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          # darwin-x64 (Intel Mac) intentionally omitted — keeps the matrix in
          # step with immorterm-memory; Apple Silicon + Linux cover the users.
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: envoyage-macos-aarch64
            cross_packages: ""
            cross_linker: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-${{ matrix.target }}-envoyage-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-envoyage-cargo-

      - name: Install cross-compilation toolchain
        if: matrix.cross_packages != ''
        env:
          CROSS_PACKAGES: ${{ matrix.cross_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y $CROSS_PACKAGES

      - name: Build binary
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: cargo build --locked --release --target "$MATRIX_TARGET" -p envoyage

      - name: Package binary
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          mkdir -p dist
          cp "target/${MATRIX_TARGET}/release/envoyage" dist/envoyage
          chmod +x dist/envoyage
          cd dist
          tar czf "${ARTIFACT_NAME}.tar.gz" envoyage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz
          retention-days: 14

  publish:
    name: Publish npm + GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Stage binaries into platform packages + sync versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd npm
          echo "Publishing @envoyage/cli npm packages v${VERSION}"

          # artifact name -> platform package dir
          declare -A ARTIFACT_TO_PKG=(
            ["envoyage-linux-x86_64"]="cli-linux-x64"
            ["envoyage-linux-aarch64"]="cli-linux-arm64"
            ["envoyage-macos-aarch64"]="cli-darwin-arm64"
          )

          for ARTIFACT in "${!ARTIFACT_TO_PKG[@]}"; do
            PKG_DIR="packages/${ARTIFACT_TO_PKG[$ARTIFACT]}"
            mkdir -p "$PKG_DIR/bin"
            # download-artifact nests each under dl/<artifact_name>/
            if [ -f "../dl/$ARTIFACT/$ARTIFACT.tar.gz" ]; then
              tar xzf "../dl/$ARTIFACT/$ARTIFACT.tar.gz" -C "$PKG_DIR/bin/"
              chmod +x "$PKG_DIR/bin/envoyage"
              echo "Extracted $ARTIFACT -> $PKG_DIR/bin/"
            else
              echo "::warning::Artifact $ARTIFACT.tar.gz not found, skipping ${ARTIFACT_TO_PKG[$ARTIFACT]}"
            fi
          done

          # Sync version across platform packages
          for PKG_DIR in packages/cli-darwin-arm64 packages/cli-linux-x64 packages/cli-linux-arm64; do
            node -e "
              const p='./$PKG_DIR/package.json'; const pkg=require(p);
              pkg.version='${VERSION}';
              require('fs').writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            "
          done
          # Sync version + optionalDependencies in the meta package
          node -e "
            const p='./package.json'; const pkg=require(p);
            pkg.version='${VERSION}';
            for (const d of Object.keys(pkg.optionalDependencies || {})) pkg.optionalDependencies[d]='${VERSION}';
            require('fs').writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      # ── Auth mode ────────────────────────────────────────────────────────
      # Default: OIDC Trusted Publishing (--provenance, no token). ONE-TIME
      # BOOTSTRAP: npm won't let you configure a Trusted Publisher until a
      # package exists, so the very first publish of these names needs a token.
      # Set the NPM_TOKEN repo secret to bootstrap; delete it once the 4 packages
      # exist + their Trusted Publishers are configured, and this reverts to OIDC.
      - name: Publish platform packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
            PUBLISH_FLAGS="--access public"            # token auth (provenance needs OIDC)
            echo "::notice::Bootstrap mode — publishing with NPM_TOKEN (no provenance)"
          else
            PUBLISH_FLAGS="--provenance --access public"
          fi
          # Platform packages first — the meta package's optionalDependencies resolve them.
          for PKG_DIR in packages/cli-linux-x64 packages/cli-linux-arm64 packages/cli-darwin-arm64; do
            if [ -f "$PKG_DIR/bin/envoyage" ]; then
              echo "Publishing $(basename "$PKG_DIR")..."
              (cd "$PKG_DIR" && npx -y npm@latest publish $PUBLISH_FLAGS) || echo "::warning::Failed to publish $(basename "$PKG_DIR")"
            else
              echo "::warning::Skipping $(basename "$PKG_DIR") — no binary"
            fi
          done

      - name: Publish meta package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
            PUBLISH_FLAGS="--access public"
          else
            PUBLISH_FLAGS="--provenance --access public"
          fi
          echo "Publishing @envoyage/cli (meta)..."
          npx -y npm@latest publish $PUBLISH_FLAGS
          echo "npm publish complete"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for ARTIFACT in envoyage-linux-x86_64 envoyage-linux-aarch64 envoyage-macos-aarch64; do
            if [ -f "dl/$ARTIFACT/$ARTIFACT.tar.gz" ]; then
              cp "dl/$ARTIFACT/$ARTIFACT.tar.gz" release/
            else
              echo "::warning::Missing artifact $ARTIFACT"
            fi
          done
          TAG="envoyage-${VERSION}"
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "envoyage ${VERSION}" \
            --notes "envoyage ${VERSION} — native binaries (macOS arm64, Linux x86_64/aarch64). Install: \`npx @envoyage/cli serve\`."

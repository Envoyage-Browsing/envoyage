[package]
name = "envoyage"
version = "0.1.1"
edition = "2024"
description = "Drive a real headless browser from any AI agent, live — with a mascot-neutral cursor/narration protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Envoyage-Browsing/envoyage"

[lib]
name = "envoyage"
path = "src/lib.rs"

[[bin]]
name = "envoyage"
path = "src/bin/envoyage.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libc::* (kill/close/fcntl/dup2) needs no feature; unistd::pipe needs "fs".
nix = { version = "0.29", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
# MCP Streamable HTTP transport (opt-in via `envoyage serve --http-port`). Matches
# the axum-based shape immorterm-memory uses for its MCP HTTP handler.
axum = "0.8"
# jpeg is REQUIRED: the live screencast is JPEG, and the GIF recorder decodes
# those frames — without the jpeg decoder, export() fails at runtime.
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg"] }
imageproc = { version = "0.27.0", default-features = false }

[dev-dependencies]
# `ServiceExt::oneshot` for the CORS middleware test (tower is already pulled in
# transitively by axum, so this adds no new crate to the build graph).
tower = { version = "0.5", features = ["util"] }
